plugins {
    id 'com.android.library'
    id 'maven-publish'
}

// Place the version of your library here
def getVersionName = { ->
    return "6.5.2"
}
// Add the name of your library here
def getReleaseArtifactId = { ->
    return "applovin-max-unity-plugin"
}

// Add the group ID of your library here
def getGroupId = { ->
    return "com.funlab.libs"
}
def getGitHubUrl = { ->
    return "https://maven.pkg.github.com/tungtbz/extralibs"
}

publishing {
    publications {
        bar(MavenPublication) {
            groupId getGroupId()
            artifactId getReleaseArtifactId()
            version getVersionName()
            // Place the path of your artifact here
            artifact("libs/${getReleaseArtifactId()}.aar")
        }
    }
    repositories {
        maven {
            name = "GitHubPackages"

            url = uri(getGitHubUrl())
            credentials {
                username = GITHUB_USER_NAME
                password = GITHUB_TOKEN_PUSH
            }
        }
    }
}

android {
    compileSdk 33

    defaultConfig {
        minSdk 21
        targetSdk 33

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'com.applovin:applovin-sdk:+'
    implementation 'com.applovin.mediation:amazon-tam-adapter:+'
    implementation 'com.amazon.android:aps-sdk:+'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation project(':base')
    implementation project(':remoteconfig')
    implementation project(':ads')
    implementation 'com.tungt:unity-classes:0.0.1'
//    implementation 'com.funlab.libs.applovin-max-unity-plugin:6.5.2'
//    implementation 'androidx.lifecycle:lifecycle-process:2.6.1'
}